version: '3.8'

services:
  decoy:
    build: .
    container_name: sentinel_decoy
    command: python app_decoy.py
    ports:
      # Exposes HTTPS on port 443 publicly
      # If port 443 is in use on your host, you can change this to "8443:443"
      - "443:443"
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: always

  dashboard:
    build: .
    container_name: sentinel_dashboard
    command: python app_dashboard.py
    ports:
      # Restricts the admin dashboard strictly to localhost 127.0.0.1 on the host machine
      - "127.0.0.1:8080:8080"
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: always
