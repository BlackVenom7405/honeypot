<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Recovery | Global Systems Integrity</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #0f172a;
        }

        p {
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 2rem;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Reset Password</h2>
        <p>Enter your corporate email address to receive a recovery link.</p>
        <form action="/forgot-password" method="POST">
            <input type="email" name="email" placeholder="email@company.com" required>
            <button type="submit">Send Recovery Email</button>
        </form>
        <div style="margin-top: 1.5rem; text-align: center;">
            <a href="/login" style="color: #2563eb; font-size: 0.875rem; text-decoration: none;">Back to Login</a>
        </div>
    </div>
</body>

</html>
